# Builds the Windows installer (NetPilot-<version>.exe) and the portable zip on every push to master.
# Download them from the run's "Artifacts" section on the repository's Actions page.
# The WiX Toolset that jpackage needs for the .exe is installed here, so no one needs it locally.
name: Windows installer

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix --version

      - name: Build installer and portable zip
        shell: bash
        run: ./mvnw -B -ntp -Pinstaller -Dinstaller.exe=true package

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: NetPilot-windows
          path: |
            target/installer/*.exe
            target/installer/*.zip
          if-no-files-found: error
          retention-days: 30
